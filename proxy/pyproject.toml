[project]
name = "wayback-proxy"
version = "0.2.0"
description = "HTTP/HTTPS proxy for Wayback Machine"
authors = [
    {name = "Marc Schütze", email = "mschuetze@zkm.de"}
]
requires-python = "^3.11"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "redis (>=8.1.0,<8.1.1)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "cryptography (>=50.0.1,<50.0.2)",
    "pyyaml (>=6.0.3,<7.0)"
]


[project.scripts]
wayback-proxy = "wayback_proxy.__main__:main"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
