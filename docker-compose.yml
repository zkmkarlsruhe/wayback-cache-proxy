version: "3.8"

services:
  proxy:
    build: ./proxy
    ports:
      - "8888:8888"
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=8888
      - TARGET_DATE=20010915
      - REDIS_URL=redis://redis:6379/0
      - ACCESS_MODE=open
    command: python -m wayback_proxy --config /app/config.yaml
    depends_on:
      - redis
    restart: unless-stopped

  admin:
    build: ./admin_service
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - CONFIG_PATH=/app/config.yaml
      - REDIS_URL=redis://redis:6379/0
    command: python -m admin_service --host 0.0.0.0 --port 8080 --config /app/config.yaml
    depends_on:
      - redis
    restart: unless-stopped

  # ── pywb instances (optional) ────────────────────────────────────
  # Uncomment and duplicate for each artwork / WARC collection.
  # Each instance needs its own config, WARC directory, and port.
  # Reference the service name in config.yaml backends chain:
  #   - type: pywb
  #     base_url: "http://pywb-artwork-a:8080"
  #     collection: "web"
  #
  # pywb-artwork-a:
  #   image: webrecorder/pywb:latest
  #   ports:
  #     - "8089:8080"
  #   volumes:
  #     - ./warcs/artwork-a:/webarchive/collections/web/archive
  #     - ./pywb-configs/artwork-a.yaml:/webarchive/config.yaml
  #   restart: unless-stopped
  #
  # pywb-artwork-b:
  #   image: webrecorder/pywb:latest
  #   ports:
  #     - "8090:8080"
  #   volumes:
  #     - ./warcs/artwork-b:/webarchive/collections/web/archive
  #     - ./pywb-configs/artwork-b.yaml:/webarchive/config.yaml
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:
