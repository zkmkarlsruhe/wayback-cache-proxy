[project]
name = "wayback-admin"
version = "0.2.0"
description = "FastAPI admin service for Wayback Cache Proxy"
authors = [
    {name = "Marc Schütze", email = "mschuetze@zkm.de"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.142.4,<1.0.0)",
    "uvicorn[standard] (>=0.54.0,<1.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0)",
    "redis (>=8.1.0,<8.1.1)",
    "python-multipart (>=0.0.32,<1.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)"
]

[project.scripts]
wayback-admin = "admin_service.__main__:main"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
